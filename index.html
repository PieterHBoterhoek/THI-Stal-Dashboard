<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THI Stal Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <h1 class="titel">THI Stal Dashboard</h1>
        <p id="waarschuwing"></p>        
    </div>
    <div class="dataInfo">
        <p id="datum">Datum: -</p>
        <p>|</p>
        <p id="huidigeWeek">Week 1</p>   
    </div>
    <div class="datumMenu">
        <div class="weekKnoppen">
            <button class="weekKnop Terug" id="weekKnopTerug" onclick="weekTerug()">&lt; Vorige week</button>
            <button class="weekKnop Verder" id="weekKnopVerder" onclick="weekVerder()">Volgende week &gt;</button>
        </div>
        <div id="dagKnoppen">
            <button class="dagknop" id="ma" onclick="kiesDag(1)">Maandag</button>
            <button class="dagknop" id="di" onclick="kiesDag(2)">Dinsdag</button>
            <button class="dagknop" id="wo" onclick="kiesDag(3)">Woensdag</button>
            <button class="dagknop" id="do" onclick="kiesDag(4)">Donderdag</button>
            <button class="dagknop" id="vr" onclick="kiesDag(5)">Vrijdag</button>
            <button class="dagknop" id="za" onclick="kiesDag(6)">Zaterdag</button>
            <button class="dagknop" id="zo" onclick="kiesDag(7)">Zondag</button>
        </div>
    </div>
    <canvas id="THI-Chart"></canvas>
</body>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="script.js"></script>
</html>
